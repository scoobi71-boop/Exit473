name: Update cached flights

on:
  schedule:
    # Runs every 9 hours (00:00, 09:00, 18:00 UTC)
    - cron: '0 */9 * * *'
  workflow_dispatch:
  
# Ensure the workflow has write permission to repository contents so it can create branches/PRs
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      # Optional: if your branch protection blocks GITHUB_TOKEN from pushing,
      # create a personal access token (repo scope) and add it as repo secret PUSH_TOKEN.
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Run flight fetcher
        run: php admin/fetch_flights.php

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update cached flights data [skip ci]" || true
          else
            echo "No changes to commit"
          fi

      - name: Create Pull Request with changes
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update cached flights data [skip ci]"
          branch: update-flights-${{ github.run_id }}
          title: "Update cached flights data"
          body: |
            Automated update of cached flights.json by scheduled workflow.
          base: ${{ github.ref_name }}
          labels: automated, flights
